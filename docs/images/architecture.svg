<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="app-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065fd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ffmpeg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27c93f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ba640;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd32a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#arch-bg)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">系统架构图</text>

  <!-- YouTube Server -->
  <g transform="translate(50, 100)" filter="url(#shadow-md)">
    <rect width="180" height="120" rx="16" fill="#2a2a2a" stroke="#ff0000" stroke-width="2"/>
    <circle cx="90" cy="40" r="25" fill="url(#yt-grad)"/>
    <polygon points="82,30 100,40 82,50" fill="white"/>
    <text x="90" y="85" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600">YouTube</text>
    <text x="90" y="105" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">Video Server</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(230, 160)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ff0000" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="60,-5 70,0 60,5" fill="#ff0000"/>
    <text x="35" y="-10" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">API Request</text>
  </g>

  <!-- Tube Downloader (Center) -->
  <g transform="translate(310, 80)" filter="url(#shadow-md)">
    <rect width="180" height="160" rx="16" fill="#2a2a2a" stroke="#065fd4" stroke-width="2"/>
    <circle cx="90" cy="40" r="25" fill="url(#app-grad)"/>
    <g transform="translate(75, 25)">
      <path d="M15,0 L15,25 M8,25 L15,32 L22,25" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="90" y="90" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600">Tube Downloader</text>
    <text x="90" y="110" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Python App</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="#333" stroke-width="1"/>
    <text x="90" y="140" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="10">yt-dlp + ThreadPool</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(490, 200)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#065fd4" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="60,-5 70,0 60,5" fill="#065fd4"/>
    <text x="35" y="-10" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Merge</text>
  </g>

  <!-- FFmpeg -->
  <g transform="translate(630, 100)" filter="url(#shadow-md)">
    <rect width="140" height="120" rx="16" fill="#2a2a2a" stroke="#27c93f" stroke-width="2"/>
    <circle cx="70" cy="40" r="25" fill="url(#ffmpeg-grad)"/>
    <text x="70" y="46" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12" font-weight="700">FF</text>
    <text x="70" y="85" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600">FFmpeg</text>
    <text x="70" y="105" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">Video/Audio Merge</text>
  </g>

  <!-- Arrow down -->
  <g transform="translate(400, 260)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#444" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="-5,60 0,70 5,60" fill="#444"/>
    <text x="10" y="35" fill="#888" font-family="sans-serif" font-size="10">Save</text>
  </g>

  <!-- Output Files -->
  <g transform="translate(50, 360)" filter="url(#shadow-md)">
    <rect width="700" height="120" rx="16" fill="#2a2a2a" stroke="#f5c518" stroke-width="2"/>
    <text x="350" y="30" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600">📁 Output Files</text>
    <line x1="20" y1="45" x2="680" y2="45" stroke="#333" stroke-width="1"/>

    <!-- Video file -->
    <g transform="translate(30, 55)">
      <rect width="100" height="50" rx="8" fill="#1a1a1a"/>
      <text x="50" y="22" text-anchor="middle" fill="#ff0033" font-family="sans-serif" font-size="16">🎬</text>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">video.mp4</text>
    </g>

    <!-- Subtitle file -->
    <g transform="translate(160, 55)">
      <rect width="100" height="50" rx="8" fill="#1a1a1a"/>
      <text x="50" y="22" text-anchor="middle" fill="#065fd4" font-family="sans-serif" font-size="16">📝</text>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">subtitle.srt</text>
    </g>

    <!-- Thumbnail file -->
    <g transform="translate(290, 55)">
      <rect width="100" height="50" rx="8" fill="#1a1a1a"/>
      <text x="50" y="22" text-anchor="middle" fill="#27c93f" font-family="sans-serif" font-size="16">🖼️</text>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">thumbnail.webp</text>
    </g>

    <!-- Multiple videos -->
    <g transform="translate(420, 55)">
      <rect width="100" height="50" rx="8" fill="#1a1a1a"/>
      <text x="50" y="22" text-anchor="middle" fill="#f5c518" font-family="sans-serif" font-size="16">⚡</text>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">Batch Mode</text>
    </g>

    <!-- Concurrent -->
    <g transform="translate(550, 55)">
      <rect width="100" height="50" rx="8" fill="#1a1a1a"/>
      <text x="50" y="22" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="16">🔀</text>
      <text x="50" y="42" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">Concurrent</text>
    </g>
  </g>
</svg>