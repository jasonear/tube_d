<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tube-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="progress-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="20" fill="url(#bg-grad)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="800" y2="50" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Left: Terminal window -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <rect width="360" height="240" rx="12" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
    
    <!-- Terminal header -->
    <rect width="360" height="32" rx="12" fill="#2d2d2d"/>
    <rect y="20" width="360" height="12" fill="#2d2d2d"/>
    
    <!-- Window controls -->
    <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="16" r="6" fill="#27c93f"/>
    
    <!-- Terminal title -->
    <text x="180" y="21" text-anchor="middle" fill="#999" font-family="monospace" font-size="12">Terminal</text>
    
    <!-- Terminal content -->
    <text x="20" y="60" fill="#27c93f" font-family="monospace" font-size="11">$ python download_youtube.py</text>
    <text x="20" y="80" fill="#888" font-family="monospace" font-size="11">https://www.youtube.com/...</text>
    
    <!-- Progress section -->
    <text x="20" y="115" fill="#ff0033" font-family="monospace" font-size="11">📥 开始下载...</text>
    
    <!-- Progress bar -->
    <rect x="20" y="125" width="320" height="20" rx="4" fill="#2a2a2a"/>
    <rect x="20" y="125" width="220" height="20" rx="4" fill="url(#progress-grad)"/>
    <text x="180" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">68.2%  584.3 MB/856.4 MB</text>
    
    <!-- Speed info -->
    <text x="20" y="165" fill="#888" font-family="monospace" font-size="11">⚡ 15.2 MB/s  ETA: 0:00:18</text>
    
    <!-- Download list -->
    <text x="20" y="200" fill="#888" font-family="monospace" font-size="11">[1/3] ✓ Video 1.mp4</text>
    <text x="20" y="220" fill="#ff0033" font-family="monospace" font-size="11">[2/3] ⬇ Video 2.mp4</text>
  </g>

  <!-- Right: Video cards -->
  <g transform="translate(460, 80)" filter="url(#shadow)">
    <!-- Video card 1 -->
    <rect width="280" height="120" rx="12" fill="#2a2a2a" stroke="#333" stroke-width="1"/>
    <rect x="160" y="12" width="108" height="68" rx="4" fill="#1a1a1a"/>
    <polygon points="195,40 215,56 195,72" fill="url(#tube-red)" filter="url(#glow)"/>
    <text x="16" y="95" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">How to Build a REST API</text>
    <text x="16" y="112" fill="#888" font-family="sans-serif" font-size="10">Programming with Mosh • 32:15</text>

    <!-- Video card 2 -->
    <g transform="translate(0, 130)">
      <rect width="280" height="120" rx="12" fill="#2a2a2a" stroke="#333" stroke-width="1"/>
      <rect x="160" y="12" width="108" height="68" rx="4" fill="#1a1a1a"/>
      <polygon points="195,40 215,56 195,72" fill="url(#tube-red)" filter="url(#glow)"/>
      <text x="16" y="95" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">Python Tutorial for Beginners</text>
      <text x="16" y="112" fill="#888" font-family="sans-serif" font-size="10">freeCodeCamp • 1:28:42</text>
    </g>
  </g>

  <!-- Animated dots -->
  <g opacity="0.6">
    <circle cx="440" cy="100" r="3" fill="#ff0033">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="150" r="3" fill="#ff0033">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="200" r="3" fill="#ff0033">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>