<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <defs>
    <linearGradient id="step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065fd4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27c93f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ba640;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd32a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-sm">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" rx="20" fill="url(#step-bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">下载流程</text>

  <!-- Arrow line -->
  <line x1="120" y1="160" x2="680" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Step 1 -->
  <g transform="translate(40, 80)">
    <rect width="120" height="160" rx="16" fill="#2a2a2a" stroke="#333" stroke-width="1" filter="url(#shadow-sm)"/>
    
    <!-- Icon -->
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-1)" opacity="0.15"/>
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-1)"/>
    <path d="M50,45 L65,55 L50,35" fill="white"/>
    
    <!-- Number -->
    <text x="60" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">1. 输入 URL</text>
    <text x="60" y="125" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">粘贴 YouTube</text>
    <text x="60" y="142" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">视频链接</text>
  </g>

  <!-- Arrow -->
  <path d="M160,160 L180,160" stroke="#ff0033" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <g transform="translate(200, 80)">
    <rect width="120" height="160" rx="16" fill="#2a2a2a" stroke="#333" stroke-width="1" filter="url(#shadow-sm)"/>
    
    <!-- Icon -->
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-2)" opacity="0.15"/>
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-2)"/>
    <g transform="translate(45, 30)">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="none" stroke="white" stroke-width="2"/>
      <line x1="5" y1="8" x2="25" y2="8" stroke="white" stroke-width="1.5"/>
      <line x1="5" y1="12" x2="20" y2="12" stroke="white" stroke-width="1.5"/>
    </g>
    
    <!-- Number -->
    <text x="60" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">2. 信息预览</text>
    <text x="60" y="125" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">查看视频</text>
    <text x="60" y="142" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">时长/大小</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(360, 80)">
    <rect width="120" height="160" rx="16" fill="#2a2a2a" stroke="#333" stroke-width="1" filter="url(#shadow-sm)"/>
    
    <!-- Icon -->
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-3)" opacity="0.15"/>
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-3)"/>
    <g transform="translate(45, 30)">
      <path d="M15,0 L15,25 M8,25 L15,32 L22,25" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Number -->
    <text x="60" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">3. 开始下载</text>
    <text x="60" y="125" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">实时进度</text>
    <text x="60" y="142" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">显示速度</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(520, 80)">
    <rect width="120" height="160" rx="16" fill="#2a2a2a" stroke="#333" stroke-width="1" filter="url(#shadow-sm)"/>
    
    <!-- Icon -->
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-4)" opacity="0.15"/>
    <circle cx="60" cy="45" r="30" fill="url(#icon-grad-4)"/>
    <g transform="translate(45, 30)">
      <path d="M10,16 L13,20 L22,8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Number -->
    <text x="60" y="100" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">4. 下载完成</text>
    <text x="60" y="125" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">视频 + 字幕</text>
    <text x="60" y="142" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="11">+ 封面图片</text>
  </g>

  <!-- Connecting arrows -->
  <g>
    <path d="M162,160 L198,160" stroke="#444" stroke-width="2"/>
    <polygon points="198,155 208,160 198,165" fill="#444"/>
  </g>
  <g>
    <path d="M322,160 L358,160" stroke="#444" stroke-width="2"/>
    <polygon points="358,155 368,160 358,165" fill="#444"/>
  </g>
  <g>
    <path d="M482,160 L518,160" stroke="#444" stroke-width="2"/>
    <polygon points="518,155 528,160 518,165" fill="#444"/>
  </g>
</svg>