<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="preview-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tube-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-lg">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="20" fill="url(#preview-bg)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">视频信息预览</text>

  <!-- Terminal Window -->
  <g transform="translate(80, 60)" filter="url(#shadow-lg)">
    <rect width="640" height="310" rx="12" fill="#1e1e1e" stroke="#333" stroke-width="1"/>

    <!-- Terminal header -->
    <rect width="640" height="36" rx="12" fill="#2d2d2d"/>
    <rect y="20" width="640" height="16" fill="#2d2d2d"/>

    <!-- Window controls -->
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>

    <!-- Terminal title -->
    <text x="320" y="23" text-anchor="middle" fill="#999" font-family="monospace" font-size="12">Preview Mode</text>

    <!-- Command -->
    <text x="20" y="68" fill="#27c93f" font-family="monospace" font-size="12">$ python download_youtube.py --preview-only</text>
    <text x="20" y="86" fill="#888" font-family="monospace" font-size="12">https://www.youtube.com/watch?v=dQw4w9WgXcQ</text>

    <!-- Separator -->
    <line x1="20" y1="100" x2="620" y2="100" stroke="#333" stroke-width="1"/>

    <!-- Preview Card -->
    <g transform="translate(20, 110)">
      <rect width="600" height="175" rx="10" fill="#2a2a2a" stroke="#444" stroke-width="1"/>

      <!-- Thumbnail -->
      <rect x="16" y="16" width="140" height="80" rx="6" fill="#1a1a1a"/>
      <polygon points="70,40 90,56 70,72" fill="url(#tube-red)" filter="url(#glow)"/>

      <!-- Info -->
      <text x="176" y="32" fill="#fff" font-family="sans-serif" font-size="14" font-weight="600">📹 How to Build a REST API</text>
      <text x="176" y="52" fill="#888" font-family="sans-serif" font-size="12">👤 Programming with Mosh</text>
      <text x="176" y="72" fill="#888" font-family="sans-serif" font-size="12">⏱️ Duration: 0:32:15</text>

      <!-- Stats row -->
      <g transform="translate(16, 108)">
        <rect width="140" height="50" rx="6" fill="#1a1a1a"/>
        <text x="70" y="25" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">📐 1920×1080</text>
        <text x="70" y="42" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Resolution</text>
      </g>

      <g transform="translate(170, 108)">
        <rect width="140" height="50" rx="6" fill="#1a1a1a"/>
        <text x="70" y="25" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">👁️ 2,456,789</text>
        <text x="70" y="42" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Views</text>
      </g>

      <g transform="translate(324, 108)">
        <rect width="140" height="50" rx="6" fill="#1a1a1a"/>
        <text x="70" y="25" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="600">💾 856.42 MB</text>
        <text x="70" y="42" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="10">Est. Size</text>
      </g>
    </g>

    <!-- Status bar -->
    <g transform="translate(20, 295)">
      <rect width="600" height="0" fill="none"/>
      <text x="0" y="0" fill="#4ade80" font-family="monospace" font-size="12">✓ Preview complete - No download started</text>
    </g>
  </g>
</svg>